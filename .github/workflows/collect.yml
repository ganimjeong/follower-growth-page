name: Collect followers

on:
  schedule:
    # GitHub 스케줄은 실제로 예약 시각보다 2~3시간 늦게 실행됨(러너 대기).
    # 그만큼 앞당겨 예약해서 실제 실행이 09~10시 KST에 걸리도록 함.
    - cron: '53 21 * * *'  # 06:53 KST 예약 (= 21:53 UTC 전날) — 1차
    - cron: '17 22 * * *'  # 07:17 KST 예약 (= 22:17 UTC 전날) — 2차 백업
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Write channels.json from secret
        run: printf '%s' "$CHANNELS_JSON" > channels.json
        env:
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}

      # 토큰이 죽으면 수집이 조용히 멈춘다. 매일 확인해서 죽었으면 여기서 실패하고,
      # 만료가 가까우면(사용자 토큰) 연장한다. 페이지 토큰이면 확인만 하고 지나간다
      - name: Check / renew token
        id: token
        run: node token-check.mjs

      # 연장됐을 때만 시크릿을 다시 쓴다. GH_PAT는 이 저장소 시크릿 쓰기 권한이 필요한데,
      # GITHUB_TOKEN으로는 시크릿을 못 바꿔서 별도 토큰이 있어야 한다.
      # 페이지 토큰을 쓰면 이 단계는 영영 돌지 않으므로 GH_PAT를 두지 않아도 된다
      - name: Store renewed token
        if: steps.token.outputs.rotated == 'true' && env.GH_PAT != ''
        run: gh secret set CHANNELS_JSON --body "$(cat channels.json)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # 한 채널이 막혀도 나머지는 저장한다. 대신 collect.mjs가 실패로 끝나 빨간 X가 남는다
      - name: Collect followers
        id: collect
        continue-on-error: true
        run: node collect.mjs data.json fnb.json

      - name: Commit data.json if changed
        if: always()
        run: |
          rm -f channels.json
          if git diff --quiet -- data.json fnb.json; then
            echo "변경 없음 — 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json fnb.json
            git commit -m "chore: 팔로워 자동 수집 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi

      # 부분 실패를 성공으로 덮지 않는다 — 커밋은 끝내되 실행 자체는 빨갛게 남긴다
      - name: Fail if collection had errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo "일부 채널 수집에 실패했다 — 위 'Collect followers' 로그 확인"
          exit 1

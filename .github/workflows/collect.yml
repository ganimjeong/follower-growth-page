name: Collect followers

on:
  schedule:
    # GitHub 스케줄은 실제로 예약 시각보다 2~3시간 늦게 실행됨(러너 대기).
    # 그만큼 앞당겨 예약해서 실제 실행이 09~10시 KST에 걸리도록 함.
    - cron: '53 21 * * *'  # 06:53 KST 예약 (= 21:53 UTC 전날) — 1차
    - cron: '17 22 * * *'  # 07:17 KST 예약 (= 22:17 UTC 전날) — 2차 백업
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Write channels.json from secret
        run: printf '%s' "$CHANNELS_JSON" > channels.json
        env:
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}

      - name: Collect followers
        run: node collect.mjs

      - name: Commit data.json if changed
        run: |
          rm -f channels.json
          if git diff --quiet -- data.json; then
            echo "변경 없음 — 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: 팔로워 자동 수집 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi

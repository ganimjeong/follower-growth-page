name: Collect followers (중지됨)

# 이 워크플로는 더 이상 예약 실행되지 않습니다.
#
# 팔로워 수집은 wayclip-booking 사이트가 직접 합니다 — 인스타 Graph API의
# Business Discovery를 Cloudflare cron이 부르고, 결과는 그쪽 D1에 쌓입니다.
# 화면도 그쪽 관리자 페이지의 '채널' 탭입니다.
#
# 여기서 계속 돌리면 같은 계정을 두 곳에서 긁게 되고, 두 숫자가 어긋났을 때 어느 쪽이
# 맞는지 아무도 모릅니다. 그래서 schedule을 뗐습니다.
#
# data.json / fnb.json 은 지우지 마세요. 2026-05-27부터의 실측이 담겨 있고,
# 사이트의 0030 마이그레이션이 이 값을 옮겨간 원본입니다.
#
# 수동 실행 버튼만 남겨둡니다 — 사이트 쪽이 오래 막혔을 때의 임시 수단입니다.
# 쓰려면 CHANNELS_JSON 시크릿이 아래 모양이어야 합니다(README 참고):
#   { "self": { "igUserId": "...", "accessToken": "...", "appId": "...", "appSecret": "..." } }

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Write channels.json from secret
        run: printf '%s' "$CHANNELS_JSON" > channels.json
        env:
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}

      - name: Check token
        id: token
        run: node token-check.mjs

      - name: Collect followers
        id: collect
        continue-on-error: true
        run: node collect.mjs data.json fnb.json

      - name: Commit if changed
        if: always()
        run: |
          rm -f channels.json
          if git diff --quiet -- data.json fnb.json; then
            echo "변경 없음 — 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json fnb.json
            git commit -m "chore: 팔로워 수동 수집 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi

      - name: Fail if collection had errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo "일부 채널 수집에 실패했다 — 위 'Collect followers' 로그 확인"
          exit 1
